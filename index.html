<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Dashboard NBRT & Mikrotrans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { tjblue: '#002855', tjorange: '#F2A900' } } } }
    </script>
    <style>
        html, body { height: 100%; margin: 0; background-color: #f8fafc; }
        #map { height: 100%; width: 100%; border-radius: 0.5rem; z-index: 10; }
        .custom-popup .leaflet-popup-content-wrapper { padding: 0; overflow: hidden; border-radius: 8px; border: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .custom-popup .leaflet-popup-content { margin: 0; width: 320px !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="flex flex-col h-screen font-sans text-gray-800 overflow-hidden">

    <header class="bg-tjblue text-white shadow-lg z-50 flex justify-between items-center px-6 py-4 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-tjorange text-tjblue font-black text-xl px-2.5 py-1 rounded shadow-sm">TJ</div>
            <div>
                <h1 class="font-bold text-xl leading-tight">Pemetaan Prasarana NBRT & Mikrotrans</h1>
                <p class="text-xs text-blue-200 font-medium tracking-wide">Pembaruan Visualisasi Berbasis Kondisi</p>
            </div>
        </div>
        <div id="loading-badge" class="px-4 py-1.5 text-xs bg-tjorange text-tjblue font-bold rounded-full animate-pulse shadow-md">
            <i class="fa-solid fa-satellite-dish mr-2"></i>Menarik Data...
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-80 bg-white shadow-xl z-40 flex flex-col h-full border-r border-gray-200 shrink-0 relative">
            <div class="p-5 flex-1 overflow-y-auto space-y-6">
                
                <div class="bg-gradient-to-br from-tjblue to-blue-900 text-white p-4 rounded-xl shadow-md border-b-4 border-tjorange">
                    <label class="block text-[11px] font-black uppercase mb-2 tracking-wider opacity-90"><i class="fa-solid fa-layer-group mr-1.5"></i> Lihat Persebaran Dari:</label>
                    <select id="view-mode" onchange="applyFilters()" class="w-full text-sm px-3 py-2 border-0 rounded text-gray-800 font-bold focus:ring-4 focus:ring-tjorange focus:outline-none cursor-pointer shadow-inner">
                        <option value="E">Ketersediaan Bus Stop</option>
                        <option value="F">Ketersediaan Papan Informasi Rute</option>
                        <option value="G">Kondisi Tempat Tunggu Pelanggan</option>
                    </select>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-2"><i class="fa-solid fa-magnifying-glass mr-1"></i> Pencarian Spesifik</h3>
                    <input type="text" id="search-input" oninput="applyFilters()" placeholder="Ketik Nama Halte atau Rute..." class="w-full text-sm px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-tjblue focus:border-tjblue outline-none transition">
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-2"><i class="fa-solid fa-list-ul mr-1"></i> Legenda Peta</h3>
                    <div id="map-legend" class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2">
                        </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase">Total Titik Tampil</p>
                        <p id="score-total" class="text-3xl font-black text-tjblue">0</p>
                    </div>
                    <i class="fa-solid fa-map-location-dot text-3xl text-blue-200"></i>
                </div>

            </div>
        </aside>

        <main class="flex-1 relative bg-gray-200">
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // MASUKKAN URL API ANDA DI SINI
        const API_URL = "https://script.google.com/macros/s/AKfycbx6XcRBW4LoiyRdxBLMLggPb6L_X0ek6d1DyfqiCcJTQSLMikw--S0aJPL60lR73mur/exec";

        let map, markerCluster, allData = [];

        // 1. Inisialisasi Peta
        map = L.map('map', { maxZoom: 18, zoomControl: false }).setView([-6.2088, 106.8456], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        markerCluster = L.markerClusterGroup({
            chunkedLoading: true, 
            maxClusterRadius: 45,
            iconCreateFunction: function(cluster) {
                return L.divIcon({ 
                    html: `<div class="bg-white text-tjblue font-black rounded-full w-10 h-10 flex items-center justify-center border-4 border-tjorange shadow-xl text-sm">${cluster.getChildCount()}</div>`, 
                    className: '', 
                    iconSize: L.point(40, 40) 
                });
            }
        });
        map.addLayer(markerCluster);

        // 2. Load Data
        window.addEventListener('DOMContentLoaded', () => fetchData());

        function fetchData() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    if(data.error) { alert(data.error); return; }
                    allData = data;
                    document.getElementById('loading-badge').classList.add('hidden');
                    applyFilters();
                })
                .catch(err => {
                    alert("Koneksi ke database gagal. Pastikan link API benar.");
                    document.getElementById('loading-badge').classList.add('hidden');
                });
        }

        // 3. Logika Simbologi Tingkat Tinggi (Merah, Oranye, Kuning, Hijau)
        function getSymbology(text) {
            text = (text || "").toLowerCase();
            
            // Kategori MERAH (Sangat Buruk / Tidak Ada)
            if (text.includes("tidak ada") || text.includes("hilang") || text.includes("sangat buruk")) {
                return { color: "bg-red-500", icon: "fa-exclamation", border: "border-red-700", textCol: "text-white" };
            }
            // Kategori ORANYE (Terhalang / Buruk / Pecah)
            if (text.includes("terhalang") || text.includes("buruk") || text.includes("pecah") || text.includes("coretan")) {
                return { color: "bg-orange-500", icon: "fa-ban", border: "border-orange-700", textCol: "text-white" };
            }
            // Kategori KUNING (Rusak / Kurang / Pudar / Kusam)
            if (text.includes("rusak") || text.includes("kurang") || text.includes("pudar") || text.includes("kusam")) {
                return { color: "bg-yellow-400", icon: "fa-triangle-exclamation", border: "border-yellow-600", textCol: "text-gray-900" };
            }
            // Kategori HIJAU (Baik / Jelas / Ada)
            if (text.includes("baik") || text.includes("ada") || text.includes("jelas")) {
                return { color: "bg-green-500", icon: "fa-check", border: "border-green-700", textCol: "text-white" };
            }
            
            // Default Abu-abu untuk data tidak terdefinisi
            return { color: "bg-gray-400", icon: "fa-circle-info", border: "border-gray-500", textCol: "text-white" };
        }

        // 4. Update Legenda Otomatis
        function updateLegend(mode) {
            const legendDiv = document.getElementById('map-legend');
            let html = '';
            
            if(mode === 'E') {
                html = `
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-green-500 border border-green-700 text-white flex justify-center items-center mr-2"><i class="fa-solid fa-check text-[10px]"></i></div> Ketersediaan: Ada / Baik</div>
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-yellow-400 border border-yellow-600 text-gray-800 flex justify-center items-center mr-2"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></div> Kondisi Rusak</div>
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-orange-500 border border-orange-700 text-white flex justify-center items-center mr-2"><i class="fa-solid fa-ban text-[10px]"></i></div> Ada, Terhalang</div>
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-red-500 border border-red-700 text-white flex justify-center items-center mr-2"><i class="fa-solid fa-exclamation text-[10px]"></i></div> Tidak Ada Bus Stop</div>
                `;
            } else {
                html = `
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-green-500 border border-green-700 text-white flex justify-center items-center mr-2"><i class="fa-solid fa-check text-[10px]"></i></div> Kondisi Baik / Jelas / Ada</div>
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-yellow-400 border border-yellow-600 text-gray-800 flex justify-center items-center mr-2"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></div> Kurang / Pudar / Kusam</div>
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-orange-500 border border-orange-700 text-white flex justify-center items-center mr-2"><i class="fa-solid fa-ban text-[10px]"></i></div> Buruk / Pecah / Coretan</div>
                    <div class="flex items-center text-xs"><div class="w-5 h-5 rounded-full bg-red-500 border border-red-700 text-white flex justify-center items-center mr-2"><i class="fa-solid fa-exclamation text-[10px]"></i></div> Tidak Ada / Hilang</div>
                `;
            }
            legendDiv.innerHTML = html;
        }

        // 5. Render Peta & Terapkan Filter
        function applyFilters() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const viewMode = document.getElementById('view-mode').value;

            updateLegend(viewMode);
            markerCluster.clearLayers();
            let count = 0;

            allData.forEach(item => {
                const matchS = !searchVal || item.nama.toLowerCase().includes(searchVal) || item.rute.toLowerCase().includes(searchVal);

                if (matchS) {
                    count++;
                    
                    // Ambil teks untuk divisualisasikan sesuai opsi dropdown
                    let valToEvaluate = item.kondisiE;
                    if(viewMode === 'F') valToEvaluate = item.kondisiF;
                    if(viewMode === 'G') valToEvaluate = item.kondisiG;

                    const sym = getSymbology(valToEvaluate);
                    
                    // Konstruksi Marker Pintar HTML
                    const htmlIcon = `<div class="w-8 h-8 rounded-full ${sym.color} ${sym.textCol} border-[3px] ${sym.border} flex items-center justify-center shadow-lg transition-transform hover:scale-110"><i class="fa-solid ${sym.icon} text-sm"></i></div>`;
                    
                    const markerIcon = L.divIcon({ html: htmlIcon, className: '', iconSize: L.point(32,32), iconAnchor: [16,16] });
                    const marker = L.marker([item.lat, item.lng], { icon: markerIcon });
                    
                    marker.bindPopup(() => createPopupContent(item, sym, viewMode), { className: 'custom-popup' });
                    markerCluster.addLayer(marker);
                }
            });

            document.getElementById('score-total').innerText = count;
        }

        // 6. Konten Popup Estetik (Dengan Perbaikan URL GDrive)
        function createPopupContent(item, sym, viewMode) {
            // Perbaikan pintar untuk URL GDrive yang 404 (menambahkan protokol HTTP jika lupa diketik di Sheet)
            let fixLink = item.dokumentasi;
            let btnDokumentasi = `<div class="text-[10px] text-gray-400 italic text-center p-2">Tautan dokumentasi tidak tersedia</div>`;
            
            if(fixLink && fixLink.length > 5) {
                if(!fixLink.startsWith('http://') && !fixLink.startsWith('https://')) {
                    fixLink = 'https://' + fixLink; 
                }
                // rel="noopener noreferrer" mencegah manipulasi tab untuk link eksternal
                btnDokumentasi = `<a href="${fixLink}" target="_blank" rel="noopener noreferrer" class="block text-center bg-tjblue hover:bg-blue-800 text-white font-bold py-2.5 rounded-b-lg text-[11px] uppercase tracking-wider transition"><i class="fa-solid fa-up-right-from-square mr-1.5"></i> Buka Foto Lapangan</a>`;
            }

            // Tanda visual yang di-highlight di dalam popup sesuai mode dropdown saat ini
            const hiE = viewMode === 'E' ? 'bg-blue-50 border-l-2 border-tjblue' : '';
            const hiF = viewMode === 'F' ? 'bg-blue-50 border-l-2 border-tjblue' : '';
            const hiG = viewMode === 'G' ? 'bg-blue-50 border-l-2 border-tjblue' : '';

            return `
                <div class="flex flex-col bg-white">
                    <div class="${sym.color} text-white px-4 py-3 flex items-start justify-between shadow-md relative z-10">
                        <div class="pr-2">
                            <h4 class="font-black text-[13px] uppercase tracking-wide leading-tight mb-1">${item.nama}</h4>
                            <span class="inline-block bg-white text-gray-900 text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm"><i class="fa-solid fa-route mr-1 text-tjorange"></i>${item.rute || 'Tidak Diketahui'}</span>
                        </div>
                        <i class="fa-solid ${sym.icon} text-2xl opacity-80"></i>
                    </div>
                    
                    <div class="px-4 py-3 text-xs text-gray-700 space-y-2.5 bg-gray-50 border-b border-gray-100">
                        <div class="flex justify-between items-center p-1.5 rounded ${hiE}">
                            <span class="font-semibold text-gray-500 w-1/2">Bus Stop (E)</span>
                            <span class="font-bold text-right text-gray-800 w-1/2">${item.kondisiE || '-'}</span>
                        </div>
                        <div class="flex justify-between items-center p-1.5 rounded ${hiF}">
                            <span class="font-semibold text-gray-500 w-1/2">Papan Rute (F)</span>
                            <span class="font-bold text-right text-gray-800 w-1/2">${item.kondisiF || '-'}</span>
                        </div>
                        <div class="flex justify-between items-center p-1.5 rounded ${hiG}">
                            <span class="font-semibold text-gray-500 w-1/2">Area Tunggu (G)</span>
                            <span class="font-bold text-right text-gray-800 w-1/2">${item.kondisiG || '-'}</span>
                        </div>
                    </div>
                    
                    <div class="px-4 py-3 bg-white">
                        <span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Keterangan Surveyor:</span>
                        <p class="text-xs text-gray-600 italic leading-relaxed">${item.keterangan || 'Tidak ada catatan tambahan.'}</p>
                    </div>
                    
                    ${btnDokumentasi}
                </div>
            `;
        }
    </script>
</body>
</html>
